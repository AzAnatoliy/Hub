version: '3.8'

services:
  # Jellyfin - медиасервер
  jellyfin:
    image: jellyfin/jellyfin:10.9.11
    container_name: jellyfin
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "render"
      - "video"
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ${DATA_DIR:-./data}/jellyfin/config:/config
      - ${DATA_DIR:-./data}/jellyfin/cache:/cache
      - ${MEDIA_DIR:-/home/media}:/media:ro
    ports:
      - "${LAN_IP:-127.0.0.1}:8096:8096"
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    mem_limit: 512m

  # Sonarr - управление сериалами
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.11
    container_name: sonarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Moscow
    volumes:
      - ${DATA_DIR:-./data}/sonarr:/config
      - ${MEDIA_DIR:-/home/media}/tv:/tv
      - ${MEDIA_DIR:-/home/media}/downloads:/downloads
    ports:
      - "${LAN_IP:-127.0.0.1}:8989:8989"
    restart: unless-stopped
    mem_limit: 300m

  # Radarr - управление фильмами
  radarr:
    image: lscr.io/linuxserver/radarr:5.16.3
    container_name: radarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Moscow
    volumes:
      - ${DATA_DIR:-./data}/radarr:/config
      - ${MEDIA_DIR:-/home/media}/movies:/movies
      - ${MEDIA_DIR:-/home/media}/downloads:/downloads
    ports:
      - "${LAN_IP:-127.0.0.1}:7878:7878"
    restart: unless-stopped
    mem_limit: 300m

  # qBittorrent - торрент-клиент
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.0.3
    container_name: qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Moscow
      - WEBUI_PORT=8080
    volumes:
      - ${DATA_DIR:-./data}/qbittorrent:/config
      - ${MEDIA_DIR:-/home/media}/downloads:/downloads
    ports:
      - "${LAN_IP:-127.0.0.1}:8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    mem_limit: 200m

  # AdGuard Home - DNS фильтрация
  adguardhome:
    image: adguard/adguardhome:v0.107.55
    container_name: adguardhome
    volumes:
      - ${DATA_DIR:-./data}/adguard/work:/opt/adguardhome/work
      - ${DATA_DIR:-./data}/adguard/conf:/opt/adguardhome/conf
    ports:
      - "${LAN_IP:-127.0.0.1}:53:53/tcp"
      - "${LAN_IP:-127.0.0.1}:53:53/udp"
      - "${LAN_IP:-127.0.0.1}:3000:3000/tcp"
    restart: unless-stopped
    mem_limit: 200m

  # Home Assistant - умный дом
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2024.12.5
    container_name: homeassistant
    network_mode: host
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ${DATA_DIR:-./data}/homeassistant:/config
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    mem_limit: 600m

  # Go2RTC - видеонаблюдение
  go2rtc:
    image: alexxit/go2rtc:1.9.7
    container_name: go2rtc
    network_mode: host
    volumes:
      - ${CONFIG_DIR:-./configs}/go2rtc:/config
      - ${MEDIA_DIR:-/home/media}/recordings:/recordings
    restart: unless-stopped
    mem_limit: 100m
