# mpv конфигурация для Media Hub
# Аппаратное ускорение Intel VA-API + ALSA exclusive

# ============================================================================
# Видео
# ============================================================================
# Аппаратное ускорение
hwdec=vaapi
vo=gpu

# Контекст GPU - auto для совместимости с X11 и Wayland
gpu-context=auto

# ============================================================================
# Аудио
# ============================================================================
# Аудио устройство - ALSA (USB ЦАП)
audio-device=alsa/default

# Эксклюзивный режим (бит-в-бит)
audio-exclusive=yes

# Формат аудио
audio-format=s24

# ============================================================================
# Субтитры
# ============================================================================
# Автоматическая загрузка субтитров
sub-auto=fuzzy
sub-font-size=28
sub-font="Arial"
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=2

# ============================================================================
# OSD
# ============================================================================
osd-level=1
osd-duration=2000
osd-font-size=24

# ============================================================================
# Кэширование
# ============================================================================
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB

# ============================================================================
# Профили качества
# ============================================================================
# profile=high-quality  # Раскомментируйте для мощных GPU

# [high-quality]
# scale=spline36
# cscale=mitchell
# dscale=mitchell
# dither=fruit

# ============================================================================
# Интерфейс
# ============================================================================
# Полноэкранный режим
fs=yes

# Скрывать курсор
cursor-autohide=1000

# Заголовок окна
title='${?media-title:${media-title}}${!media-title:${filename}} - mpv'

# ============================================================================
# Клавиатура
# ============================================================================
# Пробел - пауза
space-cycle pause

# Стрелки - перемотка
left seek -5
right seek 5
up seek 60
down seek -60

# ============================================================================
# Сеть
# ============================================================================
# Таймаут для сетевых потоков
network-timeout=30

# User agent
user-agent="MediaHub/3.0"
