name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Type check
      run: npm run typecheck
    
    - name: Build
      run: npm run build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        retention-days: 7

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for secrets
      run: |
        # Проверка что .env не закоммичен
        if git ls-files | grep -q "^\.env$"; then
          echo "❌ .env найден в git!"
          exit 1
        fi
        
        # Проверка что конфиги с паролями не закоммичены
        if git ls-files | grep -q "configs/mihomo/config.yaml"; then
          echo "⚠️  configs/mihomo/config.yaml найден в git (может содержать пароли)"
        fi
        
        echo "✅ Проверка секретов пройдена"
